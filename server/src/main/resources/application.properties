spring.application.name=mesh-backend

# SQLite 数据源:单文件,生成于 server 工作目录
spring.datasource.url=jdbc:sqlite:mesh.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 单写者:连接池压到 1,避免并发写触发 SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1
# Hibernate 社区方言 + 自动建表
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# 管理面:统计上报配置(server 为唯一配置源,客户端注册时经信令通道下发,见 SignalingWebSocketHandler.sendStatsCfg)
# enabled 总开关(false 时客户端完全不上报);interval-ms 上报周期
mesh.stats.enabled=true
mesh.stats.interval-ms=5000
# 上报字段组,逗号分隔:rtt/traffic/buffered/state/ice/path(留空 = 只报边的存在性,即裸边)
mesh.stats.fields=rtt,traffic,buffered,state,ice,path
# 快照存活判定 = ttl-factor × interval-ms(容错丢报次数),改 interval 时 TTL 自动跟随
mesh.stats.ttl-factor=3

# 管理面管理员账号:仅用于调控接口 POST /stats/config(拓扑查询、SSE、信令握手 /ws 均无需认证)
mesh.admin.user=admin
mesh.admin.password=mesh-admin
